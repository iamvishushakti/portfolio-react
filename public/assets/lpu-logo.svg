  <!-- LPU Text -->
  <text x="60" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">LPU</text>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">LOVELY PROFESSIONAL</text>
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="6.5" font-weight="400" fill="#C4B5FD" text-anchor="middle" letter-spacing="0.5">UNIVERSITY</text>
  <!-- Decorative lines -->
  <line x1="25" y1="84" x2="95" y2="84" stroke="#A78BFA" stroke-width="0.8" opacity="0.4"/>
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="5.5" fill="#DDD6FE" text-anchor="middle">Est. 2005</text>
